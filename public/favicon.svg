<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background High-Tech Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Metallic Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#555555" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#262626" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Cyan Sensor Beacon Glow -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="10"/>

  <!-- Inner Subtle HUD Technical Reticle Line -->
  <rect x="46" y="46" width="420" height="420" rx="80" ry="80" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Corner Reticle Crosshairs (Robotics Precision Alignment) -->
  <path d="M 64 94 L 64 64 L 94 64" fill="none" stroke="#525252" stroke-width="5" stroke-linecap="round"/>
  <path d="M 448 94 L 448 64 L 418 64" fill="none" stroke="#525252" stroke-width="5" stroke-linecap="round"/>
  <path d="M 64 418 L 64 448 L 94 448" fill="none" stroke="#525252" stroke-width="5" stroke-linecap="round"/>
  <path d="M 448 418 L 448 448 L 418 448" fill="none" stroke="#525252" stroke-width="5" stroke-linecap="round"/>

  <!-- Center Monogram: V and C (Crisp, High-Contrast & Separated) -->
  <g id="letters">
    <!-- Letter 'V': Pure Crisp White -->
    <path d="M 88 160 
             L 142 160 
             L 164 276 
             L 186 160 
             L 236 160 
             L 188 352 
             L 140 352 Z" 
          fill="#FFFFFF" />

    <!-- Letter 'C': Architectural Precision Silver/White with Exact Circular Arcs -->
    <path d="M 420 196
             A 88 88 0 0 0 344 164
             A 88 88 0 0 0 256 256
             A 88 88 0 0 0 344 348
             A 88 88 0 0 0 420 316
             L 380 290
             A 48 48 0 0 1 344 304
             A 48 48 0 0 1 296 256
             A 48 48 0 0 1 344 208
             A 48 48 0 0 1 380 222 Z" 
          fill="#E5E5E5" />
  </g>

  <!-- Autonomous Robotics Online Status Beacon (Cyan Accent) -->
  <circle cx="436" cy="116" r="13" fill="#00E5FF" filter="url(#beaconGlow)" />
  <circle cx="436" cy="116" r="6" fill="#FFFFFF" />

  <!-- Engineering Calibration Micro-Notch -->
  <line x1="228" y1="438" x2="284" y2="438" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
</svg>
