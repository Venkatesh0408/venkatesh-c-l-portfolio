<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    .monogram-v {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 236px;
      fill: #FFFFFF;
      letter-spacing: -12px;
    }
    .monogram-c {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 196px;
      fill: #A3A3A3;
      letter-spacing: -6px;
    }
  </style>

  <!-- Solid Black Canvas Background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Crisp White Rounded Squircle Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="#000000" stroke="#FFFFFF" stroke-width="18"/>

  <!-- Centered VC Monogram matching Header Badge -->
  <text x="256" y="266" text-anchor="middle" dominant-baseline="central">
    <tspan class="monogram-v">V</tspan><tspan class="monogram-c" dx="2">C</tspan>
  </text>
</svg>
